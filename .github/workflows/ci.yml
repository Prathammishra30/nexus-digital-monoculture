name: NEXUS CI Pipeline

on:
  push:
    branches: [ main, backend, frontend, ai-engine, discovery-engine, integration ]
  pull_request:
    branches: [ main, integration ]

jobs:
  validate-and-lint:
    name: Code Compilation & Architecture Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax & compilation
        run: |
          python -m compileall backend discovery-engine ai-engine risk-engine graph tests scripts

      - name: Run Architecture Contract Validator
        run: |
          python scripts/validation/validate_architecture.py

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
