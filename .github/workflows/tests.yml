name: NEXUS Test Suite

on:
  push:
    branches: [ main, backend, frontend, ai-engine, discovery-engine, integration ]
  pull_request:
    branches: [ main, integration ]

jobs:
  pytest:
    name: Pytest Test Matrix (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suites
        run: |
          python -m pytest tests/unit tests/contract tests/integration backend/tests ai-engine/tests -v
