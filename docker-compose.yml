version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # NEXUS Graph Database (Neo4j)
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.18-community
    container_name: nexus-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt Protocol Port
    environment:
      - NEO4J_AUTH=neo4j/nexus_secure_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./graph/neo4j/schema:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # NEXUS Core Backend & API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nexus_secure_password
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOCAL_MODEL_URL=${LOCAL_MODEL_URL:-http://host.docker.internal:11434}
      - AI_MODEL_PROVIDER=${AI_MODEL_PROVIDER:-openai}
      - AI_CONFIDENCE_THRESHOLD=${AI_CONFIDENCE_THRESHOLD:-0.75}
    volumes:
      - ./backend:/app/backend
      - ./discovery-engine:/app/discovery-engine
      - ./ai-engine:/app/ai-engine
      - ./risk-engine:/app/risk-engine
      - ./graph:/app/graph
      - ./datasets:/app/datasets
    depends_on:
      neo4j:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # NEXUS Observability Dashboard (Frontend)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
